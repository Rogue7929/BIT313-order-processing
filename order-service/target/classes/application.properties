# ============================================================
# ORDER SERVICE CONFIGURATION
# ============================================================

# Service runs on port 8080
server.port=8080

# Application name (useful for logs)
spring.application.name=order-service

# Logging level — set to DEBUG during development, INFO for benchmarking
logging.level.com.bit313=DEBUG

# Thread name in logs (helps verify virtual threads are being used)
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
